  - name: prompt-packs-and-ai-workflow-bundles
    positioning_note: "Midjourney / ChatGPT / Claude prompt bundles for creators; ₹199–₹599 instant-download hook."
  - name: spreadsheet-and-finance-templates
    positioning_note: "Excel / Google Sheets templates (budgeting, SaaS metrics, wedding planners); ₹99–₹499 anchors work."
  - name: design-assets-and-canva-templates
    positioning_note: "Canva / Instagram template packs for SMBs and creators; ₹199–₹999 with commercial license upsell."
  - name: ebook-bundles-and-printables
    positioning_note: "Downloadable guides, workbooks, wall art, life-planner PDFs; ₹99–₹599 loss-leader to ₹1,999 bundle."
